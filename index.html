<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Hassan Chachu</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fa3;--gold:#ffd54a;--blue:#4fc3ff;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;
 background:radial-gradient(circle at 30% 20%,#5b1a8c,#2a0a4d 50%,#12042a);}
canvas#fw{position:fixed;inset:0;z-index:50;pointer-events:none}
.stars{position:fixed;inset:0;z-index:0;background-image:
 radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 60%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(2px 2px at 85% 15%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 10% 70%,#fff,transparent),radial-gradient(2px 2px at 55% 10%,#fff,transparent);
 animation:twinkle 3s infinite alternate}
@keyframes twinkle{from{opacity:.4}to{opacity:1}}
#balloons{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.balloon{position:absolute;bottom:-160px;width:60px;height:76px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
 pointer-events:auto;cursor:pointer;animation:rise linear forwards;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.25)}
.balloon::before{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:inherit;border-top:0}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:70px;background:rgba(255,255,255,.6);animation:sway 2s ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-125vh)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.page{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:20px 70px;text-align:center;opacity:0;pointer-events:none;transform:translateX(60px) scale(.96);transition:all .7s ease}
.page.active{opacity:1;pointer-events:auto;transform:none}
.page.past{transform:translateX(-60px) scale(.96)}
.title{font-family:'Pacifico',cursive;font-size:clamp(34px,7vw,76px);line-height:1.15;
 background:linear-gradient(90deg,#ffd54a,#ff4fa3,#4fc3ff,#ffd54a);background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
 filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
@keyframes shine{to{background-position:300% 0}}
.sub{margin-top:10px;font-size:clamp(14px,2.5vw,20px);opacity:.9}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px)}}
.cd{display:flex;gap:12px;margin:26px 0;flex-wrap:wrap;justify-content:center}
.cd div{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);
 border-radius:16px;padding:12px 16px;min-width:76px}
.cd b{display:block;font-size:clamp(24px,5vw,38px);font-weight:800}
.cd span{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.btn{border:0;cursor:pointer;font:600 17px 'Poppins';color:#fff;padding:14px 30px;border-radius:50px;
 background:linear-gradient(135deg,#ff4fa3,#ff8a3d);box-shadow:0 8px 24px rgba(255,79,163,.5);transition:transform .2s}
.btn:hover{transform:scale(1.07)}
.btn.big{font-size:clamp(24px,5vw,34px);padding:22px 70px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 10px 40px rgba(255,79,163,.85)}}
#view{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;
 background:rgba(10,0,30,.88);opacity:0;transition:opacity .6s}
#view.show{display:flex}#view.in{opacity:1}
#view .frame{max-width:92vw;max-height:80vh;border-radius:18px;overflow:hidden;box-shadow:0 0 60px rgba(255,79,163,.6),0 20px 60px rgba(0,0,0,.6);
 border:4px solid #fff;animation:pop .8s ease}
#view img{display:block;max-width:92vw;max-height:80vh;object-fit:contain}
#view .miss{padding:40px 30px;color:#333;background:#fff;max-width:340px;font-size:16px;line-height:1.6}
#view .vnav{display:flex;gap:16px;align-items:center;margin-top:16px}
#view .vnav button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:24px;cursor:pointer}
#view .x{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.btn.small{font-size:14px;padding:9px 18px;margin-top:14px;background:linear-gradient(135deg,#4fc3ff,#7a5cff);box-shadow:0 6px 18px rgba(79,195,255,.4)}
.arrow{position:fixed;top:50%;z-index:20;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
 font-size:26px;color:#fff;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);transform:translateY(-50%);transition:.2s}
.arrow:hover{background:var(--pink);transform:translateY(-50%) scale(1.12)}
.arrow.r{right:12px;animation:nudge 1.4s infinite}.arrow.l{left:12px}
@keyframes nudge{50%{right:6px}}
.arrow.hide{display:none}
.dots{position:fixed;bottom:16px;left:0;right:0;display:flex;gap:9px;justify-content:center;z-index:20}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.dots i.on{background:var(--gold);transform:scale(1.4)}
/* gallery */
.polaroid{width:min(300px,72vw);background:#fff;padding:12px 12px 44px;border-radius:6px;color:#333;
 box-shadow:0 18px 40px rgba(0,0,0,.5);position:relative;animation:pop .8s ease}
.polaroid .ph{width:100%;aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:linear-gradient(135deg,#ffb3d9,#a5d8ff);
 display:flex;align-items:center;justify-content:center;font-size:56px}
.polaroid img{width:100%;height:100%;object-fit:cover}
.polaroid .cap{position:absolute;bottom:10px;left:0;right:0;font-family:'Pacifico';font-size:18px;color:#c2185b}
.polaroid::before{content:"📌";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:26px}
@keyframes pop{from{opacity:0;transform:rotate(-12deg) scale(.6)}to{opacity:1}}
.gnav{display:flex;gap:14px;align-items:center;margin-top:22px}
.gnav button.c{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer}
.gcount{font-size:14px;opacity:.85;min-width:50px}
/* cake */
.cakewrap{position:relative;width:min(360px,86vw);margin-top:2px}
.cakewrap svg{width:100%;display:block;overflow:visible}
.half{position:absolute;inset:0;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.half.l{clip-path:inset(0 50% 0 0)}.half.r{clip-path:inset(0 0 0 50%)}
.cakewrap.cut .half.l{transform:translateX(-26px) rotate(-4deg)}
.cakewrap.cut .half.r{transform:translateX(26px) rotate(4deg)}
.cakewrap .base{visibility:hidden}
.knife{position:absolute;left:74%;top:-70px;font-size:64px;transform:translateX(-50%) rotate(180deg);opacity:0;z-index:5;pointer-events:none}
.cakewrap.slicing .knife{animation:knife 1.1s ease forwards}
@keyframes knife{0%{opacity:1;top:-60px}65%{opacity:1;top:90px}100%{opacity:0;top:120px}}
.flame{transform-origin:center bottom;animation:flick .25s infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.cakewrap.blown .flame{animation:none;opacity:0;transition:opacity .25s}
.smoke{position:absolute;top:2%;width:10px;height:10px;border-radius:50%;background:rgba(220,220,230,.7);opacity:0;pointer-events:none;filter:blur(2px)}
.cakewrap.blown .smoke{animation:smoke 2.2s ease-out forwards}
@keyframes smoke{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(14px,-90px) scale(4)}}
#bodyG,#sliceG,#wallG{display:none}
#cakeSvg.cutstate #fullG{display:none}
#cakeSvg.cutstate #bodyG,#cakeSvg.cutstate #sliceG,#cakeSvg.cutstate #wallG{display:block}
#sliceG{transition:transform 1s cubic-bezier(.3,1.35,.5,1);transform-origin:255px 190px}
#sliceG.go{transform:translate(40px,58px) rotate(8deg)}
#tray{margin-top:8px;height:96px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed rgba(255,255,255,.35);border-radius:18px;padding:0 40px;min-width:200px}
#dk{font-size:72px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;animation:wiggle 1.3s ease-in-out infinite;z-index:70;transition:opacity .4s}
#dk.drag{cursor:grabbing;animation:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));transform:rotate(-20deg) scale(1.15)}
@keyframes wiggle{50%{transform:rotate(-14deg) translateX(8px)}}
.hint{margin-top:10px;font-size:15px;opacity:.9;min-height:24px}
/* message */
.card{max-width:640px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);
 border-radius:24px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-family:'Pacifico';font-size:clamp(24px,5vw,38px);color:var(--gold);margin-bottom:14px}
#msg{font-size:clamp(15px,2.6vw,19px);line-height:1.8;white-space:pre-wrap;text-align:left;min-height:170px}
.from{margin-top:16px;font-family:'Pacifico';font-size:22px;color:var(--pink);text-align:right}
#over{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#5b1a8c,#2a0a4d 50%,#12042a);transition:opacity .8s;
 font:800 min(40vw,220px) 'Poppins';color:var(--gold)}
#over span{animation:zoom 1s ease forwards}
@keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="stars"></div>
<div id="balloons"></div>
<canvas id="fw"></canvas>
<div id="view">
  <button class="x" id="vx">✕</button>
  <div class="frame" id="vframe"></div>
  <div class="vnav"><button id="vp">‹</button><span id="vc"></span><button id="vn">›</button></div>
</div>
<div id="over"><span id="overn">3</span></div>

<!-- PAGE 1: Welcome -->
<section class="page active" id="p0">
  <div class="bounce" style="font-size:64px">🎉🎂🎈</div>
  <h1 class="title">Happy Birthday</h1>
  <h1 class="title" style="margin-top:4px">Hassan Chachu</h1>
  <p class="sub">Aaj hai bohat khaas din! 🎊</p>
  <br>
  <button class="btn big" id="start">💌 Open Wishes</button>
</section>

<!-- PAGE 2: Photos -->
<section class="page" id="p1">
  <h2 class="title" style="font-size:clamp(28px,5vw,48px);margin-bottom:22px">Yaadgar Lamhe 📸</h2>
  <div id="pol"></div>
  <div class="gnav"><button class="c" id="gp">‹</button><span class="gcount" id="gc"></span><button class="c" id="gn">›</button></div>
  <button class="btn small" onclick="document.getElementById('file').click()">➕ Photos Add Karo</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</section>

<!-- PAGE 3: Message -->
<section class="page" id="p3">
  <div class="card">
    <h2>Khaas Paigham 💌</h2>
    <div id="msg"></div>
    <div class="from">— Abdullah ❤️</div>
  </div>
  <button class="btn small" id="again">🎆 Phir Se Fireworks</button>
</section>

<!-- LAST PAGE: Cake -->
<section class="page" id="p2">
  <h1 class="title">Happy Birthday<br>Hassan Chachu 🎂</h1>
  <div class="cakewrap" id="cake">
    <div class="knife">🔪</div>
    <svg id="cakeSvg" viewBox="0 30 340 250"></svg>
  </div>
  <p class="hint" id="hint">🔪 Knife ko pakad kar cake ke upar le jao!</p>
  <div id="tray"><div id="dk">🔪</div></div>
</section>

<button class="arrow l hide" id="prev">‹</button>
<button class="arrow r" id="next">›</button>
<div class="dots" id="dots"></div>

const $=id=>document.getElementById(id);
const pages=[...document.querySelectorAll('.page')];
let cur=0;
const dots=$('dots');pages.forEach(()=>dots.appendChild(document.createElement('i')));

function go(n){
  if(n<0||n>=pages.length)return;
  pages.forEach((p,i)=>{p.classList.toggle('active',i===n);p.classList.toggle('past',i<n)});
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===n));
  $('prev').classList.toggle('hide',n===0);
  $('next').classList.toggle('hide',n===pages.length-1);
  cur=n;
  if(n===2){typeMsg();burst(3)}
  if(n===1)burst(2);
  if(n===3)burst(1);
}
$('next').onclick=()=>go(cur+1);$('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1))});
go(0);

/* ---------- Balloons ---------- */
const colors=['#ff4f6d','#ffd54a','#4fc3ff','#7be07b','#c77dff','#ff9f43','#ff4fa3'];
function balloon(){
  const b=document.createElement('div');b.className='balloon';
  const c=colors[Math.random()*colors.length|0];
  b.style.background=c;b.style.borderBottomColor=c;
  const s=.7+Math.random()*.8;b.style.width=60*s+'px';b.style.height=76*s+'px';
  b.style.left=Math.random()*95+'vw';b.style.animationDuration=(7+Math.random()*7)+'s';
  b.onclick=()=>{popAt(b.getBoundingClientRect(),c);b.remove()};
  $('balloons').appendChild(b);setTimeout(()=>b.remove(),15000);
}
setInterval(balloon,900);for(let i=0;i<6;i++)setTimeout(balloon,i*250);

/* ---------- Fireworks / confetti canvas ---------- */
const cv=$('fw'),ctx=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
let rockets=[],parts=[];
function launch(x){rockets.push({x:x??Math.random()*W,y:H,vy:-(9+Math.random()*5),tx:Math.random()*H*.4+60,
  hue:Math.random()*360})}
function explode(x,y,hue){
  const n=70;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,sp=2+Math.random()*4.5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+Math.random()*40,r:2+Math.random()*2})}
}
function popAt(r,c){for(let i=0;i<24;i++){const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:c,r:3})}}
function confetti(){for(let i=0;i<120;i++)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
  life:1.6,col:colors[Math.random()*colors.length|0],r:4+Math.random()*3,sq:1,g:.02})}
function burst(n){for(let i=0;i<n;i++)setTimeout(()=>launch(),i*350)}
function loop(){
  ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{r.y+=r.vy;r.vy*=.985;
    ctx.fillStyle=`hsl(${r.hue},100%,70%)`;ctx.fillRect(r.x,r.y,3,10);
    if(r.y<=r.tx||r.vy>-1.5){explode(r.x,r.y,r.hue);return false}return true});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g??.06;p.vx*=.99;p.life-=.012;
    ctx.globalAlpha=Math.max(p.life,0);
    ctx.fillStyle=p.col||`hsl(${p.hue},100%,60%)`;
    p.sq?ctx.fillRect(p.x,p.y,p.r*1.6,p.r):(ctx.beginPath(),ctx.arc(p.x,p.y,p.r,0,6.28),ctx.fill());
    ctx.globalAlpha=1;return p.life>0&&p.y<H+20});
  requestAnimationFrame(loop);
}loop();
cv.parentNode.addEventListener('click',e=>{if(!e.target.closest('button,.balloon,.card,.cakewrap'))launch(e.clientX)});


/* 3-2-1 intro: website khulte hi chalta hai, phir sab kuch shuru */
(function intro(){
  const o=$('over'),n=$('overn');let c=3;
  const step=()=>{
    if(c===0){
      o.style.opacity=0;setTimeout(()=>o.style.display='none',800);
      burst(10);confetti();setTimeout(()=>burst(6),1500);return;
    }
    n.style.animation='none';void n.offsetWidth;n.style.animation='';n.textContent=c--;setTimeout(step,1000);
  };
  setTimeout(step,400);
})();
/* ---------- View: birthday images ---------- */
let vi=0;
function showView(){
  const f=$('vframe'),src=BIRTHDAY_IMAGES[vi];
  f.style.animation='none';void f.offsetWidth;f.style.animation='';
  f.innerHTML=`<img src="${src}" alt="Happy Birthday" onerror="this.outerHTML='<div class=miss>🖼️ Image nahi mili:<br><b>${src}</b><br>Ye file HTML ke saath isi naam se rakhein.</div>'">`;
  $('vc').textContent=`${vi+1} / ${BIRTHDAY_IMAGES.length}`;
  $('vn').textContent=(vi>=BIRTHDAY_IMAGES.length-1)?'🎂':'›';
}
$('start').onclick=()=>{
  vi=0;showView();const v=$('view');v.classList.add('show');setTimeout(()=>v.classList.add('in'),20);
  burst(8);confetti();
};
$('vx').onclick=()=>{const v=$('view');v.classList.remove('in');setTimeout(()=>v.classList.remove('show'),600)};
$('vn').onclick=()=>{
  if(vi>=BIRTHDAY_IMAGES.length-1){ /* last image ke baad Next -> Cake page */
    const v=$('view');v.classList.remove('in');setTimeout(()=>v.classList.remove('show'),600);
    go(pages.length-1);return;
  }
  vi++;showView();burst(3);
};
$('vp').onclick=()=>{vi=(vi-1+BIRTHDAY_IMAGES.length)%BIRTHDAY_IMAGES.length;showView();burst(3)};
$('again').onclick=()=>{burst(8);confetti()};

/* ---------- Photos ---------- */
let imgs=[],gi=0,timer;
function loadOk(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(src);i.onerror=()=>r(null);i.src=src})}
Promise.all(PHOTOS.map(loadOk)).then(list=>{imgs=list.filter(Boolean);showPhoto()});
function showPhoto(){
  const box=$('pol');const total=imgs.length||3;gi=(gi+total)%total;
  const cap=CAPTIONS[gi%CAPTIONS.length];
  const tilt=(Math.random()*8-4).toFixed(1);
  box.innerHTML=`<div class="polaroid" style="--t:${tilt}deg;transform:rotate(${tilt}deg)">
    <div class="ph">${imgs.length?`<img src="${imgs[gi]}" alt="">`:'📸'}</div><div class="cap">${cap}</div></div>`;
  $('gc').textContent=`${gi+1} / ${total}`;
  clearInterval(timer);timer=setInterval(()=>{gi++;showPhoto()},3800);
}
$('gn').onclick=()=>{gi++;showPhoto()};$('gp').onclick=()=>{gi--;showPhoto()};
$('file').onchange=e=>{
  const urls=[...e.target.files].map(f=>URL.createObjectURL(f));
  imgs=imgs.concat(urls);gi=imgs.length-urls.length;showPhoto();
};

/* ---------- Cake (front view, triangle slice) ---------- */
const CX=170,CY=125,RX=135,RY=48,CKH=80,T1=28,T2=68;
const rad=d=>d*Math.PI/180, f=n=>n.toFixed(1);
const pt=(d,dy=0,k=1)=>[CX+RX*k*Math.cos(rad(d)),CY+RY*k*Math.sin(rad(d))+dy];
const P1t=pt(T1),P2t=pt(T2);
const arcPts=(a,b,dy)=>{const o=[];for(let i=0;i<=10;i++)o.push(pt(a+(b-a)*i/10,dy));return o};
const Rpts=[[CX,CY],P1t,...arcPts(T1,T2,CKH),P2t];
const Rstr=Rpts.map(q=>f(q[0])+','+f(q[1])).join(' ');
const Rpath='M'+Rpts.map(q=>f(q[0])+' '+f(q[1])).join(' L')+' Z';
const bandY=CY+36;
const defs=`<defs>
 <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc9e2"/><stop offset="1" stop-color="#ff8fc0"/></linearGradient>
 <radialGradient id="gTop" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fffdfd"/><stop offset="1" stop-color="#ffe0ee"/></radialGradient>
 <radialGradient id="gPlate" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd3e6"/></radialGradient>
 <path id="frontArc" d="M${CX-RX} ${bandY} A${RX} ${RY} 0 0 0 ${CX+RX} ${bandY}"/>
 <clipPath id="cutR"><polygon points="${Rstr}"/></clipPath>
 <clipPath id="keepC"><path clip-rule="evenodd" d="M-200 -200H600V600H-200Z ${Rpath}"/></clipPath>
</defs>`;
function art(){
  let o='';
  // side
  o+=`<path d="M${CX-RX} ${CY} A${RX} ${RY} 0 0 0 ${CX+RX} ${CY} L${CX+RX} ${CY+CKH} A${RX} ${RY} 0 0 1 ${CX-RX} ${CY+CKH} Z" fill="url(#gSide)"/>`;
  o+=`<path d="M${CX-RX} ${CY+CKH-14} A${RX} ${RY} 0 0 0 ${CX+RX} ${CY+CKH-14}" fill="none" stroke="#ff74b0" stroke-width="2" opacity=".5"/>`;
  for(let d=0;d<=180;d+=9){const q=pt(d,CKH-5);o+=`<circle cx="${f(q[0])}" cy="${f(q[1])}" r="4.6" fill="#fff"/>`}
  // text on the front
  o+=`<text font-family="Pacifico,cursive" font-size="19" fill="#b3123f" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round"><textPath href="#frontArc" startOffset="31%" text-anchor="middle">HBD Hassan Chachu</textPath></text>`;
  // top
  o+=`<ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="url(#gTop)" stroke="#ffb3d5" stroke-width="2"/>`;
  o+=`<ellipse cx="${CX}" cy="${CY}" rx="${RX-20}" ry="${RY-9}" fill="none" stroke="#ffc9e2" stroke-width="1.5" stroke-dasharray="3 5"/>`;
  const ros=[];for(let d=0;d<360;d+=14)ros.push(d);
  ros.sort((a,b)=>Math.sin(rad(a))-Math.sin(rad(b)));
  ros.forEach(d=>{const q=pt(d,0,.93);o+=`<circle cx="${f(q[0])}" cy="${f(q[1])}" r="6.5" fill="#fff" stroke="#ffc1de" stroke-width="1.5"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="2" fill="#ffb3d5"/>`});
  // strawberries
  [48,110,160,250].forEach(d=>{const q=pt(d,0,.72);const x=f(q[0]),y=f(q[1]);
    o+=`<g><ellipse cx="${x}" cy="${y}" rx="9" ry="8" fill="#e5173f"/><path d="M${x-6} ${y-6} l6 -6 l6 6 l-6 3z" fill="#2e9e44"/><circle cx="${x-3}" cy="${y}" r="1" fill="#ffd9a0"/><circle cx="${+x+3}" cy="${+y+2}" r="1" fill="#ffd9a0"/></g>`});
  // candles (back half)
  [[130,112,'#4fc3ff'],[155,106,'#ffd54a'],[185,106,'#7be07b'],[210,112,'#c77dff']].forEach(c=>{
    o+=`<rect x="${c[0]-3.5}" y="${c[1]-34}" width="7" height="34" rx="2" fill="${c[2]}"/><rect x="${c[0]-3.5}" y="${c[1]-26}" width="7" height="4" fill="#fff" opacity=".6"/>`+
       `<ellipse class="flame" cx="${c[0]}" cy="${c[1]-45}" rx="5" ry="9" fill="#ffb300"/><ellipse class="flame" cx="${c[0]}" cy="${c[1]-43}" rx="2.5" ry="5" fill="#fff3a0"/>`});
  return o;
}
function wall(P,tag){ // sponge cut-face, skewed parallelogram
  const w=P[0]-CX, ang=Math.atan2(P[1]-CY,w)*180/Math.PI;
  return `<g transform="translate(${CX},${CY}) skewY(${f(ang)})">
   <rect x="0" y="0" width="${f(w)}" height="${CKH}" fill="#e8b078"/>
   <rect x="0" y="0" width="${f(w)}" height="7" fill="#ffe3f0"/>
   <rect x="0" y="33" width="${f(w)}" height="11" fill="#fff4e4"/>
   <rect x="0" y="${CKH-8}" width="${f(w)}" height="8" fill="#ffc1de"/>
   <rect x="0" y="0" width="${f(w)}" height="${CKH}" fill="${tag==='L'?'rgba(0,0,0,.10)':'none'}"/></g>`;
}
const cakeSvg=$('cakeSvg'),cake=$('cake');
cakeSvg.innerHTML=defs+
 `<ellipse cx="${CX}" cy="${CY+CKH+6}" rx="${RX+24}" ry="${RY+10}" fill="#9aa0bd" opacity=".35"/>`+
 `<ellipse cx="${CX}" cy="${CY+CKH+2}" rx="${RX+24}" ry="${RY+10}" fill="url(#gPlate)" stroke="#d9dcec" stroke-width="2"/>`+
 `<g id="fullG">${art()}</g>`+
 `<g id="wallG" clip-path="url(#cutR)">${wall(P1t,'R')}</g>`+
 `<g id="bodyG" clip-path="url(#keepC)">${art()}</g>`+
 `<g id="sliceG">${wall(P2t,'L')}<g clip-path="url(#cutR)">${art()}</g></g>`;
// smoke puffs above candles
[[130,112],[155,106],[185,106],[210,112]].forEach(c=>{
  const sp=document.createElement('span');sp.className='smoke';
  sp.style.left=(c[0]/340*100)+'%';sp.style.top=((c[1]-52-30)/250*100)+'%';cake.appendChild(sp)});
let cutDone=false;
function cutCake(){
  if(cutDone)return;cutDone=true;
  $('dk').style.opacity=0;$('dk').style.pointerEvents='none';
  cake.classList.add('blown');$('hint').textContent='Phooooo! 💨 Candles bujh gayin...';
  setTimeout(()=>{cake.classList.add('slicing');$('hint').textContent='Cake kat raha hai... 🔪'},700);
  setTimeout(()=>{
    cakeSvg.classList.add('cutstate');
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('sliceG').classList.add('go')));
    burst(12);confetti();setTimeout(confetti,900);setTimeout(()=>burst(8),1600);
    $('hint').textContent='🎉🎂 Happy Birthday Hassan Chachu! 🎂🎉';$('tray').style.display='none';
  },1500);
}
cake.onclick=cutCake;
/* knife drag */
(function(){
  const dk=$('dk');let drag=false,ox=0,oy=0;
  dk.addEventListener('pointerdown',e=>{
    if(cutDone)return;drag=true;dk.setPointerCapture(e.pointerId);
    const r=dk.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
    dk.style.position='fixed';dk.style.left=r.left+'px';dk.style.top=r.top+'px';dk.classList.add('drag');e.preventDefault();
  });
  dk.addEventListener('pointermove',e=>{
    if(!drag)return;dk.style.left=(e.clientX-ox)+'px';dk.style.top=(e.clientY-oy)+'px';
    const c=cake.getBoundingClientRect();
    if(e.clientX>c.left&&e.clientX<c.right&&e.clientY>c.top&&e.clientY<c.bottom){drag=false;cutCake()}
  });
  const end=()=>{if(!drag)return;drag=false;if(!cutDone){dk.classList.remove('drag');dk.style.position='';dk.style.left=dk.style.top=''}};
  dk.addEventListener('pointerup',end);dk.addEventListener('pointercancel',end);
})();
let typed=false;
function typeMsg(){
  if(typed)return;typed=true;const el=$('msg');let i=0;
  (function t(){el.textContent=MESSAGE.slice(0,++i);if(i<MESSAGE.length)setTimeout(t,38)})();
}
</script>
